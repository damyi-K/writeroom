<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f7f9;--card:#fff;--ink:#1f2430;--soft:#6b7280;--line:#e6e8ee;
  --accent:#1f7a6d;--on-accent:#fff;--accent-soft:#e3f3ef;
  --tank1:#e8f3fb;--tank2:#f8fbfd;--note-ink:#1f2430;
  --serif:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--ink:#eceff4;--soft:#9aa3b2;--line:#2b313c;--accent:#5ec4b3;--on-accent:#0e2823;--accent-soft:#1e3532;--tank1:#1a2733;--tank2:#151b24}
}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--ink:#eceff4;--soft:#9aa3b2;--line:#2b313c;--accent:#5ec4b3;--on-accent:#0e2823;--accent-soft:#1e3532;--tank1:#1a2733;--tank2:#151b24}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:calc(16px*var(--fz,1))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:.9375rem;line-height:1.65}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 64px}
header{padding:8px 0 4px}
h1{font-family:var(--serif);font-weight:700;font-size:2rem;margin:0;letter-spacing:.01em}
.sub{color:var(--soft);margin:2px 0 0}
nav{display:flex;gap:4px;margin:20px 0 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;color:var(--soft);font:500 .95rem var(--sans);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section[hidden]{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
input[type=number]{width:140px}
textarea{width:100%;resize:vertical;min-height:70px}
.grow{flex:1 1 160px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:500 .9rem var(--sans);padding:8px 16px;border-radius:10px;cursor:pointer}
.btn.sec{background:transparent;color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--soft);padding:4px 8px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.3;cursor:default}
.empty{text-align:center;color:var(--soft);padding:36px 10px}
.stats{display:flex;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.stat{flex:1;padding:14px 16px;color:var(--soft);font-size:.85rem}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--ink);font-weight:700}
.work{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.work h2,.ev h2{margin:0;font-family:var(--serif);font-size:1.2rem;font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.seg{height:100%;min-width:3px;box-shadow:inset -1px 0 0 var(--card)}
.lg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.78rem;color:var(--soft);min-width:0}
.lg span{margin-right:12px}
.swg{display:inline-flex;align-items:center}
.swg .btn.ghost{padding:2px 6px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.meta{display:flex;justify-content:space-between;color:var(--soft);font-size:.85rem}
.chips{display:flex;gap:8px}
.chip{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.chip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.note{color:var(--note-ink);padding:16px 16px 10px;border-radius:12px;min-height:140px;white-space:pre-wrap;word-break:break-word;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(20,30,50,.08)}
.note small{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.8rem}
.note .btn.ghost{color:rgba(31,36,48,.6)}
.c0{background:#fdf2c4}.c1{background:#fbdde0}.c2{background:#d5f0e4}.c3{background:#d6e8fb}.c4{background:#e5def8}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:500}
.note .pill{background:rgba(255,255,255,.65);color:var(--note-ink)}
.tl{list-style:none;margin:0 0 0 5px;padding:0 0 0 22px;border-left:1px solid var(--line)}
.ev{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.ev::before{content:"";position:absolute;left:-28px;top:17px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.ev .when{color:var(--accent);font-size:.82rem;font-weight:700}
.ev p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.ev .tools{display:flex;gap:2px;align-items:center;margin-top:6px}
.ev .pill{margin-right:auto}
.filter{margin-bottom:14px}
.aq{position:relative;width:min(100%,780px);aspect-ratio:16/10.5;margin:0 auto;filter:drop-shadow(0 12px 12px rgba(0,0,0,.14))}
.tank{position:absolute;inset:0;overflow:hidden;clip-path:url(#bowl);background:linear-gradient(180deg,transparent 0 17%,var(--w1,#d3ecf8) 18%,var(--w2,#93cde9))}
.deco{position:absolute;left:0;bottom:0;width:100%;pointer-events:none}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
.sway.d2{animation-delay:-1.3s}.sway.d3{animation-delay:-2.6s}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
.glass{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.glass path{fill:none;stroke:rgba(120,170,200,.7);stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.glass path+path{stroke:rgba(255,255,255,.7);stroke-width:6;stroke-linecap:round}
.bub{position:absolute;bottom:20px;width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.25);animation:rise 7s linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-520px);opacity:0}}
.tank .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--soft);text-align:center;padding:20px}
.fish{position:absolute;z-index:1;left:0;top:0;cursor:grab;touch-action:none;will-change:transform}
.fish img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.fish.sel img{outline:2px dashed rgba(255,255,255,.95);outline-offset:3px}
.fish .x{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--card);display:none;cursor:pointer;font-size:14px;line-height:1;padding:0}
.fish.sel .x{display:block}
.lbl{color:var(--soft);font-size:.85rem}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.swb{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px 4px 5px;font:inherit;font-size:.85rem;cursor:pointer}
.swb i{width:22px;height:22px;border-radius:50%;background:linear-gradient(90deg,var(--b) 50%,var(--a) 50%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swb[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
input[type=color]{width:42px;height:34px;padding:2px;border-radius:10px;cursor:pointer}
input[type=range]{padding:0;accent-color:var(--accent);vertical-align:middle}
.post{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.post:hover{border-color:var(--accent)}
.post b{font-weight:500}
.post .pv{color:var(--soft);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.post .mt{color:var(--soft);font-size:.78rem;margin-top:4px}
.cc{color:var(--accent);font-weight:700;margin-left:4px}
.body{white-space:pre-wrap;word-break:break-word;line-height:1.9;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:12px 0}
.cm{padding:10px 0;border-bottom:1px solid var(--line)}
.cm small{color:var(--soft)}
.ev.imp{border-color:var(--accent);background:var(--accent-soft)}
.ev.imp::before{width:15px;height:15px;left:-30px;top:15px;box-shadow:0 0 0 4px var(--accent-soft)}
.btn.ghost.star.on{color:#e0a100}
@media (prefers-reduced-motion:reduce){.fill{transition:none}.bub{display:none}.sway{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row"><h1 class="grow">글방</h1><button class="btn sec" data-act="decor" aria-label="설정" title="설정" style="padding:7px 9px;line-height:0"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
    <p class="sub">쓰고, 모으고, 정리하는 작은 책상</p>
  </header>
  <div class="panel" id="decor" hidden style="margin-top:14px">
    <div class="lbl">테마</div><div class="sw" id="sw"></div>
    <div class="row"><span class="lbl">직접 고르기</span><label class="lbl">포인트 색 <input type="color" id="cAc" value="#1f7a6d"></label><label class="lbl">배경 색 <input type="color" id="cBg" value="#f6f7f9"></label><input id="tName" placeholder="테마 이름" maxlength="12" style="width:120px"><button class="btn sec" data-act="saveTheme">이 색 저장</button></div>
    <div class="row" style="margin-top:14px"><label class="lbl">글꼴 <select id="fontSel"></select></label><label class="lbl">글자 크기 <input type="range" id="fzR" min="0.85" max="1.4" step="0.05" value="1"> <span id="fzV">100%</span></label><button class="btn ghost" data-act="resetDecor">처음 모습으로</button></div>
    <div class="row" style="margin-top:14px"><span class="lbl">백업</span><button class="btn sec" data-act="exportBk">백업 저장</button><button class="btn sec" data-act="importBk">백업 불러오기</button><span class="lbl grow" id="bkMsg"></span></div>
    <textarea id="bkTxt" hidden readonly style="margin-top:8px;min-height:90px;font-size:.75rem"></textarea>
    <input type="file" id="bkIn" accept="application/json,.json" hidden>
  </div>
  <nav role="tablist">
    <button class="tab" role="tab" data-tab="works" aria-selected="true">작품</button>
    <button class="tab" role="tab" data-tab="memos" aria-selected="false">메모판</button>
    <button class="tab" role="tab" data-tab="bbs" aria-selected="false">게시판</button>
    <button class="tab" role="tab" data-tab="events" aria-selected="false">주요 사건</button>
  </nav>

  <section id="works">
    <div class="stats" id="stats"></div>
    <div class="panel row">
      <input id="wTitle" class="grow" placeholder="작품 제목" maxlength="60">
      <input id="wGoal" type="number" min="0" placeholder="목표 글자 수">
      <button class="btn" data-act="addWork">작품 추가</button>
    </div>
    <div id="workList"></div>
  </section>

  <section id="memos" hidden>
    <div class="panel">
      <textarea id="mText" placeholder="떠오른 생각을 적어보세요" maxlength="400"></textarea>
      <div class="row" style="margin-top:10px">
        <div class="chips" id="chips"></div>
        <select id="mWork" class="grow"></select>
        <button class="btn" id="mAdd" data-act="addMemo">메모 붙이기</button><button class="btn ghost" id="mCancel" data-act="cancelMemo" hidden>취소</button>
      </div>
    </div>
    <div class="filter"><select id="mFilter" aria-label="작품별로 보기"></select></div>
    <div class="board" id="board"></div>
  </section>

  <section id="bbs" hidden>
    <div class="row filter" id="bTop"><input id="bQ" class="grow" placeholder="글 검색"><select id="bCat" aria-label="말머리"></select><button class="btn" data-act="newPost">글쓰기</button></div>
    <div id="bBody"></div>
  </section>

  <section id="events" hidden>
    <div class="panel">
      <div class="row">
        <input id="eWhen" placeholder="시점 (예: 3장, 2024-05-01)" class="grow" maxlength="40">
        <input id="eTitle" placeholder="사건 이름" class="grow" maxlength="60">
      </div>
      <textarea id="eDesc" placeholder="무슨 일이 있었나요? (선택)" style="margin-top:10px" maxlength="400"></textarea>
      <div class="row" style="margin-top:10px">
        <select id="eWork" class="grow"></select>
        <label class="lbl"><input type="checkbox" id="eStar"> ★ 중요한 사건</label><button class="btn" data-act="addEvent">사건 추가</button>
      </div>
    </div>
    <div class="row filter"><select id="eFilter" aria-label="작품별로 보기"></select><label class="lbl"><input type="checkbox" id="eImp"> 중요한 사건만 보기</label></div>
    <ol class="tl" id="tl"></ol>
  </section>

  <section id="fish" hidden>
    <div class="row" style="margin-bottom:12px">
      <button class="btn" data-act="pick">사진 추가</button>
      <label class="lbl">크기 <input type="range" id="szR" min="0.3" max="2.5" step="0.05" value="1" disabled></label><span class="sub grow" id="fnote">사진을 탭하면 크기를 바꾸거나 지울 수 있어요. (최대 20장)</span>
    </div>
    <input type="file" id="fileIn" accept="image/*" multiple hidden>
    <div class="aq"><svg width="0" height="0" style="position:absolute" aria-hidden="true"><clipPath id="bowl" clipPathUnits="objectBoundingBox"><path d="M.3,.1 Q.325,.05 .35,.1 T.4,.1 T.45,.1 T.5,.1 T.55,.1 T.6,.1 T.65,.1 T.7,.1 C.7,.22 1,.2 1,.6 C1,.88 .75,1 .5,1 C.25,1 0,.88 0,.6 C0,.2 .3,.22 .3,.1Z"/></clipPath></svg><div class="tank" id="tank"><svg class="deco" viewBox="0 0 400 70" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><path d="M0,56 Q80,46 200,54 T400,52 V70 H0Z" fill="#e9d6a1"/><path d="M0,62 Q120,55 240,61 T400,58 V70 H0Z" fill="#dcc48a"/><g transform="translate(100,0)"><g class="sway"><path d="M36,58 C28,48 42,40 34,28 C30,22 34,16 36,12" stroke="#3f9b5c" stroke-width="4.5" fill="none" stroke-linecap="round"/></g><g class="sway d2"><path d="M46,59 C54,50 42,42 50,32" stroke="#62b86f" stroke-width="3.5" fill="none" stroke-linecap="round"/></g><g class="sway d3"><path d="M164,58 C156,48 170,40 162,30 C159,25 163,20 165,16" stroke="#3f9b5c" stroke-width="4.5" fill="none" stroke-linecap="round"/></g><ellipse cx="56" cy="58" rx="10" ry="6.5" fill="#9aa7b2"/><ellipse cx="65" cy="60" rx="7" ry="5" fill="#b6c0c9"/><rect x="74" y="54" width="16" height="9" rx="2" fill="#a9713a"/><path d="M74,54 Q82,46 90,54Z" fill="#c88a4a"/><rect x="80" y="54" width="4" height="4" fill="#ffd35a"/><polygon points="100,49 101.5,53 106,53.2 102.5,56 103.7,60.4 100,57.8 96.3,60.4 97.5,56 94,53.2 98.5,53" fill="#ffa24d"/><path d="M124,58 V44 M124,51 L117,42 M124,47 L131,39" stroke="#ff8fa3" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M140,62 Q146,50 152,62Z" fill="#ffd6c9" stroke="#e9a58f" stroke-width="1"/><circle cx="112" cy="62" r="2" fill="#c9b27a"/><circle cx="116" cy="63.5" r="1.5" fill="#b79f66"/><circle cx="156" cy="63" r="2" fill="#c9b27a"/></g><g class="sway d2"><path d="M112,59 C104,49 118,41 110,30 C107,25 111,19 113,15" stroke="#2f8a50" stroke-width="4" fill="none" stroke-linecap="round"/></g><g class="sway"><path d="M300,58 C292,48 306,40 298,30" stroke="#62b86f" stroke-width="4" fill="none" stroke-linecap="round"/></g><path d="M282,62 Q288,52 294,62Z" fill="#ffe3a8" stroke="#e0b96a" stroke-width="1"/><ellipse cx="96" cy="61" rx="7" ry="4.5" fill="#a9b4be"/></svg><span class="bub" style="left:12%"></span><span class="bub" style="left:38%;animation-delay:2.5s;width:7px;height:7px"></span><span class="bub" style="left:66%;animation-delay:4s"></span><span class="bub" style="left:88%;animation-delay:1.2s;width:6px;height:6px"></span><div class="hint" id="hint">사진을 추가하면 이곳을 천천히 떠다녀요.</div></div><svg class="glass" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"><path d="M.3,.1 Q.325,.05 .35,.1 T.4,.1 T.45,.1 T.5,.1 T.55,.1 T.6,.1 T.65,.1 T.7,.1 C.7,.22 1,.2 1,.6 C1,.88 .75,1 .5,1 C.25,1 0,.88 0,.6 C0,.2 .3,.22 .3,.1Z"/><path d="M.12,.45 C.08,.6 .12,.78 .22,.86"/></svg></div>
  </section>
</div>

<script>
(function(){
  var KEY='writing-nook-v1',SK='writing-nook-stickers-v1',MAXF=20;
  var S={works:[],memos:[],events:[],posts:[]},ST=[];
  var tab='works',color=0,fMemo='',fEv='';
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);S.works=p.works||[];S.memos=p.memos||[];S.events=p.events||[];S.posts=p.posts||[];}}catch(e){}
  try{var r2=localStorage.getItem(SK);if(r2)ST=JSON.parse(r2)||[];}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  function saveSt(){try{localStorage.setItem(SK,JSON.stringify(ST));return true;}catch(e){return false;}}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function $(id){return document.getElementById(id);}
  function fmt(n){return Number(n).toLocaleString('ko-KR');}
  function wname(id){for(var i=0;i<S.works.length;i++)if(S.works[i].id===id)return S.works[i].title;return '';}

  function workOptions(sel,all,keep){
    var h='<option value="">'+(all?'모든 작품':'작품 선택 안 함')+'</option>';

  /* sticker aquarium */
  var F=[],raf=0,last=0,tank=$('tank'),built=false;
  function place(f,t){
    var bob=reduce?0:Math.sin(t/900+f.ph)*5;
    f.el.style.transform='translate3d('+f.x.toFixed(1)+'px,'+(f.y+bob).toFixed(1)+'px,0)';
  }
  function addFish(s){
    var W=tank.clientWidth||600,H=tank.clientHeight||400;
    var sc=s.sc||1;var el=document.createElement('div');el.className='fish';
    el.innerHTML='<img alt="스티커" width="'+Math.round(s.w*sc)+'" height="'+Math.round(s.h*sc)+'" src="'+s.src+'"><button class="x" aria-label="스티커 지우기">×</button>';
    tank.appendChild(el);
    var f={id:s.id,s:s,el:el,w:Math.round(s.w*sc),h:Math.round(s.h*sc),ph:Math.random()*6.28,
      x:bnd().l+Math.random()*Math.max(1,bnd().r-bnd().l-s.w*sc),y:bnd().t+Math.random()*Math.max(1,bnd().b-bnd().t-s.h*sc),
      vx:(Math.random()<.5?-1:1)*(18+Math.random()*28),vy:(Math.random()<.5?-1:1)*(8+Math.random()*14),drag:null};
    F.push(f);place(f,performance.now());
    el.addEventListener('pointerdown',function(e){
      if(e.target.classList.contains('x'))return;
      var r=tank.getBoundingClientRect();
      f.drag={ox:e.clientX-r.left-f.x,oy:e.clientY-r.top-f.y,sx:e.clientX,sy:e.clientY,moved:false};
      el.setPointerCapture(e.pointerId);el.style.cursor='grabbing';
    });
    el.addEventListener('pointermove',function(e){
      if(!f.drag)return;
      if(Math.abs(e.clientX-f.drag.sx)+Math.abs(e.clientY-f.drag.sy)>5)f.drag.moved=true;
      var r=tank.getBoundingClientRect();
      var bd=bnd();f.x=Math.max(bd.l,Math.min(bd.r-f.w,e.clientX-r.left-f.drag.ox));
      f.y=Math.max(bd.t,Math.min(bd.b-f.h,e.clientY-r.top-f.drag.oy));
      if(reduce)place(f,0);
    });
    function up(){
      if(!f.drag)return;
      if(!f.drag.moved){pick(el.classList.contains('sel')?null:f);}
      f.drag=null;el.style.cursor='';
    }
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    el.querySelector('.x').addEventListener('click',function(){
      if(SEL===f)pick(null);ST=ST.filter(function(x){return x.id!==f.id;});F=F.filter(function(g){return g!==f;});el.remove();saveSt();hint();
    });
  }
  function hint(){$('hint').style.display=F.length?'none':'flex';}
  function tick(ts){
    if(tab!=='fish'){raf=0;return;}
    var dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
    var b=bnd();
    F.forEach(function(f){
      if(!f.drag){
        f.x+=f.vx*dt;f.y+=f.vy*dt;
        if(f.x<b.l){f.x=b.l;f.vx=Math.abs(f.vx);}
        if(f.x>b.r-f.w){f.x=Math.max(b.l,b.r-f.w);f.vx=-Math.abs(f.vx);}
        if(f.y<b.t){f.y=b.t;f.vy=Math.abs(f.vy);}
        if(f.y>b.b-f.h){f.y=Math.max(b.t,b.b-f.h);f.vy=-Math.abs(f.vy);}
      }
      place(f,ts);
    });
    raf=requestAnimationFrame(tick);
  }
  function showFish(){

  function addFiles(files){
    Array.prototype.forEach.call(files,function(file){
      if(ST.length>=MAXF){$('fnote').textContent='스티커는 최대 '+MAXF+'장까지 넣을 수 있어요.';return;}
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){
        var k=Math.min(1,320/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
        var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        var s={id:uid(),src:c.toDataURL('image/webp',.85),w:w,h:h,sc:.55};
        ST.push(s);
        if(!saveSt()){ST.pop();$('fnote').textContent='저장 공간이 부족해서 이 사진은 넣지 못했어요.';return;}
        addFish(s);hint();
      };
      img.onerror=function(){URL.revokeObjectURL(url);$('fnote').textContent='사진을 열 수 없어요.';};
      img.src=url;
    });
  }

  function adj(w,d){
    if(!w.log)w.log=w.done>0?[{n:w.done,c:-1}]:[];

  function act2(a,id){
    var p;
    if(a==='decor'){$('decor').hidden=!$('decor').hidden;return true;}
    if(a==='resetDecor'){PF={theme:{m:'d'},font:'',saved:PF.saved||[]};savePf();applyPrefs();return true;}
    if(a==='saveTheme'){
      PF.saved=PF.saved||[];if(PF.saved.length>=8){return true;}
      var nm=$('tName').value.trim()||('내 테마 '+(PF.saved.length+1));
      PF.saved.push({n:nm.slice(0,12),bg:$('cBg').value,ac:$('cAc').value});$('tName').value='';
      PF.theme={m:'p',bg:$('cBg').value,ac:$('cAc').value};savePf();applyPrefs();return true;
    }
    if(a==='exportBk'){exportBk();return true;}
    if(a==='importBk'){$('bkIn').click();return true;}
    if(a==='cancelMemo'){endEdit();return true;}
    if(a==='editMemo'){
      var m=S.memos.find(function(x){return x.id===id;});if(!m)return true;
      editM=id;$('mText').value=m.text;color=m.color;drawChips();$('mWork').value=m.work;
      $('mAdd').textContent='수정 완료';$('mCancel').hidden=false;$('mText').focus();return true;
    }
    if(a==='applyCount'){var w=S.works.find(function(x){return x.id===id;}),nv=parseInt($('set-'+id).value);if(w&&!isNaN(nv))adj(w,Math.max(0,nv)-w.done);editW=null;}
    else if(a==='cancelCount'){editW=null;}
    else if(a==='star'){var e=S.events.find(function(x){return x.id===id;});e.imp=!e.imp;}
    else if(a==='newPost'){bv='write';editP=null;}
    else if(a==='openPost'){bv='detail';bid=id;}
    else if(a==='backBbs'){bv=(bv==='write'&&editP)?'detail':'list';editP=null;}
    else if(a==='editPost'){bv='write';editP=bid;}
    else if(a==='savePost'){
      var t=$('pTitle').value.trim(),b=$('pBody').value.trim();
      if(!t||!b){(t?$('pBody'):$('pTitle')).focus();return true;}
      if(editP){p=post(editP);p.title=t;p.body=b;p.cat=$('pCat').value;p.work=$('pWork').value;}
      else{p={id:uid(),title:t,body:b,cat:$('pCat').value,work:$('pWork').value,at:Date.now(),likes:0,liked:false,cm:[]};S.posts.unshift(p);bid=p.id;}
      bv='detail';editP=null;
    }
    else if(a==='delPost'){if(!sure('p'))return true;S.posts=S.posts.filter(function(x){return x.id!==bid;});bv='list';}
    else if(a==='likePost'){p=post(bid);p.liked=!p.liked;p.likes+=p.liked?1:-1;}
    else if(a==='addCmt'){var v=$('cIn').value.trim();if(!v)return true;post(bid).cm.push({id:uid(),text:v,at:Date.now()});}
    else if(a==='delCmt'){p=post(bid);p.cm=p.cm.filter(function(c){return c.id!==id;});}
    else return false;
    save();render();return true;
  }

  function applyPrefs(){
    var st=document.documentElement.style,t=PF.theme||{m:'d'};
    ['--bg','--card','--ink','--soft','--line','--accent','--on-accent','--accent-soft','--w1','--w2'].forEach(function(v){st.removeProperty(v);});
    if(t.bg&&t.ac){
      var dk=lum(t.bg)<.45,card=dk?mix(t.bg,'#ffffff',.06):mix(t.bg,'#ffffff',.7);
      var m={'--bg':t.bg,'--card':card,'--ink':dk?'#eceff4':'#1f2430','--soft':dk?'#9aa3b2':'#6b7280','--line':dk?mix(t.bg,'#ffffff',.13):mix(t.bg,'#000000',.09),'--accent':t.ac,'--on-accent':lum(t.ac)>.55?'#10201d':'#ffffff','--accent-soft':mix(card,t.ac,dk?.2:.13),'--w1':dk?'#1d3a4d':'#d3ecf8','--w2':dk?'#12283a':'#93cde9'};
      for(var k in m)st.setProperty(k,m[k]);
    }
    var f=FONTS.find(function(x){return x.n===PF.font;});
    if(f&&f.f){
      var lid='fl-'+f.f.replace(/ /g,'');
      if(!document.getElementById(lid)){var l=document.createElement('link');l.id=lid;l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+f.f.replace(/ /g,'+')+'&display=swap';document.head.appendChild(l);}
      st.setProperty('--sans','"'+f.f+'",sans-serif');st.setProperty('--serif','"'+f.f+'",serif');
    }else{st.removeProperty('--sans');st.removeProperty('--serif');}
    if(PF.fz&&PF.fz!==1)st.setProperty('--fz',PF.fz);else st.removeProperty('--fz');
    drawDecor();
  }
  function drawDecor(){
    var t=PF.theme||{m:'d'};
    $('sw').innerHTML=THEMES.concat((PF.saved||[]).map(function(s){return {n:s.n,bg:s.bg,ac:s.ac,sv:1};})).map(function(x,i){
      var on=x.m?(t.m==='d'):(t.bg===x.bg&&t.ac===x.ac);
      return (x.sv?'<span class="swg">':'')+'<button class="swb" '+(x.sv?'data-s="'+(i-THEMES.length)+'"':'data-i="'+i+'"')+' aria-pressed="'+on+'"><i style="--b:'+(x.bg||'#f6f7f9')+';--a:'+(x.ac||'#1f7a6d')+'"></i>'+esc(x.n)+'</button>'+(x.sv?'<button class="btn ghost" data-del="'+(i-THEMES.length)+'" aria-label="저장한 테마 삭제">×</button></span>':'');
    }).join('');
    $('fontSel').innerHTML=FONTS.map(function(x){return '<option'+(x.n===(PF.font||'기본')?' selected':'')+'>'+x.n+'</option>';}).join('');
    $('cBg').value=t.bg||'#f6f7f9';$('cAc').value=t.ac||'#1f7a6d';$('fzR').value=PF.fz||1;$('fzV').textContent=Math.round((PF.fz||1)*100)+'%';
  }
  $('sw').addEventListener('click',function(e){
    var d=e.target.closest('[data-del]');if(d){PF.saved.splice(+d.dataset.del,1);savePf();drawDecor();return;}var b=e.target.closest('.swb');if(!b)return;var x=b.dataset.s!==undefined?PF.saved[+b.dataset.s]:THEMES[+b.dataset.i];
    PF.theme=x.m?{m:'d'}:{m:'p',bg:x.bg,ac:x.ac};savePf();applyPrefs();
  });
  var dl=null;
  try{if(window.claude&&claude.use)claude.use('downloads').then(function(d){dl=d;},function(){});}catch(e){}
  function bkData(){return JSON.stringify({app:'writing-nook',v:1,at:Date.now(),S:S,ST:ST,PF:PF});}
  function bkMsg(t){$('bkMsg').textContent=t;}
  function exportBk(){
    var d=new Date(),nm='글방-백업-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';
    if(!dl){$('bkTxt').hidden=false;$('bkTxt').value=bkData();$('bkTxt').select();bkMsg('파일 저장이 막혀 있어요. 아래 내용을 통째로 복사해 보관하세요.');return;}
    dl.save({filename:nm,data:bkData()}).then(function(){bkMsg('백업 파일을 저장했어요.');},function(e){bkMsg(e&&e.code==='declined'?'저장을 취소했어요.':'저장하지 못했어요.');});
  }
  $('bkIn').addEventListener('change',function(){
    var f=this.files[0];this.value='';if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);if(!o||o.app!=='writing-nook'||!o.S)throw 0;
        S={works:o.S.works||[],memos:o.S.memos||[],events:o.S.events||[],posts:o.S.posts||[]};
        ST=o.ST||[];PF=o.PF||{theme:{m:'d'},font:''};
        save();saveSt();savePf();
        F.forEach(function(g){g.el.remove();});F=[];built=false;pick(null);
        applyPrefs();render();bkMsg('백업을 불러왔어요.');
      }catch(e){bkMsg('올바른 백업 파일이 아니에요.');}
    };
    r.readAsText(f);
  });
  $('fzR').addEventListener('input',function(){
    PF.fz=parseFloat(this.value);$('fzV').textContent=Math.round(PF.fz*100)+'%';
    if(PF.fz!==1)document.documentElement.style.setProperty('--fz',PF.fz);else document.documentElement.style.removeProperty('--fz');
  });
  $('fzR').addEventListener('change',savePf);
  function custom(){PF.theme={m:'c',bg:$('cBg').value,ac:$('cAc').value};savePf();applyPrefs();}
  $('cBg').addEventListener('input',custom);$('cAc').addEventListener('input',custom);
  $('fontSel').addEventListener('change',function(){PF.font=this.value==='기본'?'':this.value;savePf();applyPrefs();});

  function render(){
    ['works','memos','bbs','events','fish'].forEach(function(t){$(t).hidden=(t!==tab);});
    document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===tab);});
    if(tab==='works')renderWorks();else if(tab==='memos')renderMemos();else if(tab==='events')renderEvents();else if(tab==='bbs')renderBBS();else showFish();
  }

  function move(id,dir){
    var vis=evList();
    var i=vis.findIndex(function(e){return e.id===id;}),j=i+dir;
    if(i<0||j<0||j>=vis.length)return;
    var a=S.events.indexOf(vis[i]),b=S.events.indexOf(vis[j]);
    var t=S.events[a];S.events[a]=S.events[b];S.events[b]=t;
  }

  document.addEventListener('click',function(ev){
    var t=ev.target.closest('[data-tab],[data-act],.chip');if(!t)return;
    if(t.dataset.tab){tab=t.dataset.tab;render();return;}
    if(t.classList.contains('chip')){color=+t.dataset.c;drawChips();return;}
    var a=t.dataset.act,id=t.dataset.id;
    if(a==='pick'){$('fileIn').click();return;}
    if(act2(a,id))return;
    if(a==='addWork'){
      var title=$('wTitle').value.trim();if(!title){$('wTitle').focus();return;}
      S.works.push({id:uid(),title:title,goal:Math.max(0,parseInt($('wGoal').value)||0),done:0});
      $('wTitle').value='';$('wGoal').value='';
    }else if(a==='delWork'){
      if(!sure('w'+id))return;
      S.works=S.works.filter(function(w){return w.id!==id;});
    }else if(a==='addCount'){
      var n=parseInt($('add-'+id).value);if(!n)return;
      S.works.forEach(function(w){if(w.id===id)adj(w,n);});
    }else if(a==='setCount'){
      var w=S.works.find(function(x){return x.id===id;});
      editW=id;render();return;
      w.done=Math.max(0,parseInt(v)||0);
    }else if(a==='addMemo'){
      var tx=$('mText').value.trim();if(!tx){$('mText').focus();return;}
      if(editM){var m0=S.memos.find(function(m){return m.id===editM;});if(m0){m0.text=tx;m0.color=color;m0.work=$('mWork').value;}endEdit();}
      else S.memos.unshift({id:uid(),text:tx,color:color,work:$('mWork').value});$('mText').value='';
    }else if(a==='delMemo'){S.memos=S.memos.filter(function(m){return m.id!==id;});}
    else if(a==='addEvent'){
      var et=$('eTitle').value.trim();if(!et){$('eTitle').focus();return;}
      S.events.push({id:uid(),when:$('eWhen').value.trim(),title:et,desc:$('eDesc').value.trim(),work:$('eWork').value,imp:$('eStar').checked});
      $('eWhen').value='';$('eTitle').value='';$('eDesc').value='';$('eStar').checked=false;
    }else if(a==='delEvent'){S.events=S.events.filter(function(e){return e.id!==id;});}
    else if(a==='up')move(id,-1);else if(a==='down')move(id,1);
    save();render();
  });
  $('mFilter').addEventListener('change',function(){fMemo=this.value;renderMemos();});
  $('eFilter').addEventListener('change',function(){fEv=this.value;renderEvents();});
  $('fileIn').addEventListener('change',function(){addFiles(this.files);this.value='';});

  function drawChips(){
    var cs=['#fdf2c4','#fbdde0','#d5f0e4','#d6e8fb','#e5def8'],h='';
    cs.forEach(function(c,i){h+='<button class="chip" data-c="'+i+'" style="background:'+c+'" aria-label="메모 색 '+(i+1)+'" aria-pressed="'+(i===color)+'"></button>';});
    $('chips').innerHTML=h;
  }
  drawChips();applyPrefs();render();
})();
</script>
</body>
</html>
